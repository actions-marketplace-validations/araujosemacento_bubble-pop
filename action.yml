name: "Bubble Pop GitHub Contribution Grid"
description: "Generates a dynamic, continuous bubbling & popping animated SVG of your GitHub contribution grid"
author: "G. Melo"
branding:
  icon: "circle"
  color: "gray-dark"

inputs:
  github_user_name:
    description: "The GitHub username to fetch the contribution grid for"
    required: true
  github_token:
    description: "GitHub Personal Access Token (PAT) or GITHUB_TOKEN to authorize the GraphQL API request"
    required: true
  output_path:
    description: "The path and filename where the generated SVG will be saved"
    required: false
    default: "dist/github-contribution-grid-bubble.svg"
  theme:
    description: 'Theme style for the SVG card ("auto", "dark", "light", "rose-pine", "rose-pine-dawn", "dracula", "alucard", "mocha", "latte", "gitlab-dark", "gitlab-light", "codeberg-dark", "codeberg-light")'
    required: false
    default: "auto"
  show_header:
    description: "Whether to render the title and total contribution count header (true/false)"
    required: false
    default: "true"
  show_labels:
    description: "Whether to render the month and weekday labels (true/false)"
    required: false
    default: "true"
  show_avatar:
    description: "Whether to render the user avatar beside the username in the header (true/false)"
    required: false
    default: "false"

outputs:
  svg_path:
    description: "The resolved path of the generated SVG file"

runs:
  using: "node20"
  main: "dist/index.js"
