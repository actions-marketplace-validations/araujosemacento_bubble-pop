<!DOCTYPE html>
<html lang="en" data-theme="rose-pine">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble Pop - GitHub Contribution Grid Visualizer</title>
  <meta name="description" content="Dynamic bubbling contribution grid SVG visualizer for GitHub profiles." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css" />
</head>

<body>

  <!-- Centered Floating Application Layout -->
  <div class="app-layout">

    <!-- Upper Section: User & Theme Clusters Grouped in the Center -->
    <header class="top-cluster" aria-label="Controls">
      <!-- Left: User Avatar & Input -->
      <div class="user-cluster">
        <div class="avatar-wrapper" id="avatar-wrapper" title="GitHub User Avatar">
          <img id="user-avatar-img" class="user-avatar" src="https://github.com/octocat.png?size=120" alt="Avatar" />
          <svg id="user-avatar-fallback" class="avatar-fallback hidden" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.75">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
          </svg>
        </div>

        <form id="search-form" class="user-form">
          <div class="user-input-wrap">
            <input type="text" id="username-input" class="user-input" placeholder="user" value="octocat"
              autocomplete="off" spellcheck="false" />
            <button type="submit" class="submit-btn" id="submit-btn" title="Render">Render</button>
          </div>
        </form>

        <div class="preset-row">
          <span class="preset-label">presets:</span>
          <div class="preset-list">
            <button type="button" class="preset-btn" data-user="octocat">octocat</button>
            <button type="button" class="preset-btn" data-user="torvalds">torvalds</button>
            <button type="button" class="preset-btn" data-user="yyx990803">yyx990803</button>
            <button type="button" class="preset-btn" data-user="gaearon">gaearon</button>
            <button type="button" class="preset-btn" data-user="mock">mock</button>
          </div>
        </div>
      </div>

      <!-- Subtle Floating Vertical Divider -->
      <div class="floating-divider" aria-hidden="true"></div>

      <!-- Right: Divided Theme Selection & Controls -->
      <div class="theme-cluster">
        <!-- Expandable / Collapsible Custom Theme Select with Dynamic Chevron -->
        <div class="custom-select" id="theme-select-container">
          <button type="button" id="theme-select-trigger" class="select-trigger" aria-haspopup="listbox" aria-expanded="false" title="Choose visual theme">
            <span class="select-title">theme:</span>
            <span class="select-current" id="select-current">rose-pine</span>
            <svg class="select-chevron" id="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <div class="select-dropdown hidden" id="theme-dropdown" role="listbox" aria-label="Theme Selection">
            <button type="button" class="theme-item" data-theme="auto" role="option">auto</button>

            <div class="theme-group-header" role="presentation" aria-hidden="true">
              <span class="group-title">##### DARK #####</span>
            </div>

            <button type="button" class="theme-item" data-theme="dark" role="option">github</button>
            <button type="button" class="theme-item" data-theme="gitlab-dark" role="option">gitlab</button>
            <button type="button" class="theme-item" data-theme="codeberg-dark" role="option">codeberg</button>
            <button type="button" class="theme-item active" data-theme="rose-pine" role="option">rose-pine</button>
            <button type="button" class="theme-item" data-theme="dracula" role="option">dracula</button>
            <button type="button" class="theme-item" data-theme="mocha" role="option">mocha</button>

            <div class="theme-group-header" role="presentation" aria-hidden="true">
              <span class="group-title">##### LIGHT #####</span>
            </div>

            <button type="button" class="theme-item" data-theme="light" role="option">github</button>
            <button type="button" class="theme-item" data-theme="gitlab-light" role="option">gitlab</button>
            <button type="button" class="theme-item" data-theme="codeberg-light" role="option">codeberg</button>
            <button type="button" class="theme-item" data-theme="rose-pine-dawn" role="option">rose-pine-dawn</button>
            <button type="button" class="theme-item" data-theme="alucard" role="option">alucard</button>
            <button type="button" class="theme-item" data-theme="latte" role="option">latte</button>
          </div>
        </div>

        <div class="speed-row">
          <label for="duration-input" class="speed-label">speed: <span id="duration-value">5.5s</span></label>
          <input type="range" id="duration-input" class="speed-slider" min="3.0" max="9.0" step="0.5" value="5.5" />
        </div>

        <div class="token-toggle-row">
          <button type="button" id="pat-toggle-btn" class="token-toggle-btn">personal access token</button>
        </div>

        <div id="pat-container" class="token-input-row hidden">
          <input type="password" id="pat-input" class="token-input"
            placeholder="personal access token for private grids" autocomplete="off" />
        </div>
      </div>
    </header>

    <!-- Center Section: Seamless Floating SVG Stage -->
    <main class="stage-section" id="stage-container">
      <div class="status-bar">
        <span id="status-line" class="status-line status-ready">Ready</span>
      </div>

      <div class="svg-viewport">
        <div id="svg-wrapper" class="svg-wrapper"></div>
      </div>
    </main>

    <!-- Bottom Section: Spaced Away Floating Copy Bar -->
    <footer class="bottom-cluster" aria-label="Copy and Export">
      <div class="copy-bar">
        <div class="copy-tabs" id="copy-tabs">
          <button type="button" class="copy-tab active" data-format="markdown">markdown</button>
          <button type="button" class="copy-tab" data-format="workflow">workflow</button>
          <button type="button" class="copy-tab" data-format="svg">svg</button>
        </div>

        <div class="copy-field-wrap">
          <input type="text" id="copy-input" class="copy-input" readonly spellcheck="false" value="" />
        </div>

        <div class="copy-actions">
          <button type="button" id="copy-btn" class="icon-btn copy-action-btn" title="Copy to clipboard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
          <button type="button" id="download-btn" class="icon-btn download-action-btn" title="Download SVG">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="footer-links">
        <span>bubble-pop</span>
        <span class="meta-sep">|</span>
        <a href="https://github.com/marketplace/actions/bubble-pop-github-contribution-grid" target="_blank" rel="noopener noreferrer">marketplace</a>
        <span class="meta-sep">|</span>
        <a href="https://github.com/araujosemacento/bubble-pop" target="_blank" rel="noopener noreferrer">github</a>
      </div>
    </footer>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
